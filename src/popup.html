<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crunchyroll Random Anime</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <h1 data-i18n="extName">Crunchyroll Random Anime</h1>
    </header>

    <button id="random" type="button">
      <img src="icons/randomimg.png" alt="" width="20" height="20" />
      <span data-i18n="popupRandomButton">Surprise me</span>
    </button>
    <p class="hint">
      <span data-i18n="popupShortcut">Shortcut:</span>
      <kbd id="shortcut">Alt+Shift+R</kbd>
    </p>

    <fieldset>
      <label>
        <input type="checkbox" id="showLabel" />
        <span data-i18n="settingShowLabel">Show "Random Anime" text in the header</span>
      </label>
      <label>
        <input type="checkbox" id="openInNewTab" />
        <span data-i18n="settingNewTab">Open random anime in a new tab</span>
      </label>
    </fieldset>

    <footer>
      <a href="https://github.com/noahbds/crunchyroll-random-anime" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span id="version"></span>
    </footer>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
